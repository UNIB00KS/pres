**Agosto de 2025.** Destituida la responsable de una oficina de **estadísticas laborales**, horas después de publicar un dato de empleo peor de lo esperado.

**Julio de 2026.** Un excargo de una administración autonómica queda **imputado** por manipular un audio de AEMET hasta convertirlo en un bulo sobre la DANA.
]

]

# Seis temas, seis preguntas

| | La pregunta | Dónde se decidió mal |
|:--|:--|:--|
| **T1** | ¿Qué distingue saber de creer con convicción? | La ilusión de competencia |
| **T2** | ¿Por qué divergen el consenso técnico y el debate social? | Tabaco, ozono, clima: la duda fabricada |
| **T3** | ¿Qué creer cuando no se puede comprobar en persona? | Escepticismo climático |
| **T4** | ¿Quién paga, quién evalúa, quién publica? | Cárteles de citación, revisión por indicadores cuantitativos |
| **T5** | ¿De quién es el conocimiento pagado con dinero público? | Patentes, muros de pago |
| **T6** | ¿Qué le hace a la deliberación una infraestructura algorítmica? | Propaganda en red, dataísmo, IA |

# Cómo trabajamos: tres cosas distintas

.pull-left[
### Exposición individual
Sostener una tesis ante los demás, con el texto delante, y responder a la objeción sin refugiarse en el grupo.

**Criterio:** que formules una objeción a tu propio texto y la respondas.

### Estudio de caso
Juzgar un episodio con información incompleta y sin etiqueta.

**Criterio:** identificar qué información faltaba y qué habría cambiado con ella.
]

.pull-right[
### Taller en equipo
Repartir el trabajo documental, contrastar fuentes que se contradicen y cerrar un dosier con los desacuerdos dentro.

**Criterio:** que el dosier registre lo que el grupo **no** logró acordar.

.dato[
**Por qué tanta actividad y tan poco examen.** La asignatura sostiene que el conocimiento es social, distribuido y falible. Evaluarlo solo con un examen individual sería enseñar una tesis y calificar con la contraria.
]
]

# Talleres

.pull-left[
### Tres equipos de diez

**Tres talleres**, unos diez integrantes cada uno, elegidos entre los temas que el libro cubre con material propio:

- Clima, energía y sostenibilidad
- Robótica e inteligencia artificial
- Ciberseguridad, desinformación y vigilancia

**Producto:** un dosier documental que sirva para trabajar, no para adornar.
]

.pull-right[
### Dos reglas del equipo

**Traza de autoría.** Cada fuente incorporada lleva las iniciales de quien la localizó y verificó. Es la práctica normal de un grupo de investigación, y hace visible quién hizo qué dentro de diez.

**Contradictor rotatorio.** En cada sesión, alguien distinto tiene el encargo explícito de sostener la objeción más fuerte contra la línea que el grupo sigue.

.small[Así el desacuerdo es un papel asignado y no un acto de valentía personal.]
]

# Estudios de caso: el protocolo de cierre

No basta contar o narrar un caso: **hay que cerrarlo**. Cinco preguntas clave como criterio:

.tight[
1. ¿Qué información faltaba en el momento de decidir?
2. ¿Qué habría cambiado de haberla tenido?
3. ¿Quién soportaba la carga de la prueba, y la aceptó?
4. ¿Existía un procedimiento de corrección, y se activó?
5. ¿Qué consecuencia tuvo activarlo?
]

.dato[
La monografía trae un **índice con más de treinta casos ya documentados**. Es el punto de partida obligado: nadie debería elegir tema sin haberlo recorrido antes.
]

.small[Limitarse a narrar el caso deja sin responder las cuestiones clave (2-5).]
